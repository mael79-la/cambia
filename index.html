<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA Meta -->
  <meta name="application-name" content="AppFX">
  <meta name="description" content="Cambiador de logos con 6 efectos visuales — PWA">
  <meta name="theme-color" content="#FF2D2D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AppFX">
  <meta name="msapplication-TileColor" content="#FF2D2D">
  <meta name="msapplication-TileImage" content="icons/icon-144.png">

  <!-- Favicon & Icons -->
  <link rel="icon"             href="icons/favicon.ico" sizes="any">
  <link rel="icon"             href="icons/icon-32.png"  type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="apple-touch-icon" href="icons/icon-152.png" sizes="152x152">
  <link rel="apple-touch-icon" href="icons/icon-144.png" sizes="144x144">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <title>AppFX — Cambiador de Logos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- SVG Filters ocultos -->
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="f-burn" x="-30%" y="-30%" width="160%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="4" seed="8" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="28" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="f-frost" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="5" result="noise"/>
        <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
        <feBlend in="SourceGraphic" in2="mono" mode="overlay" result="blended"/>
        <feColorMatrix in="blended" type="matrix"
          values="0.65 0.1 0.1 0 0.1
                  0.65 0.1 0.1 0 0.1
                  0.80 0.1 0.2 0 0.2
                  0    0   0   1 0"/>
      </filter>
    </defs>
  </svg>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <div class="brand-wrap">
        <img src="icons/icon-32.png" alt="AppFX" class="brand-icon">
        <span class="brand">App<em>FX</em></span>
      </div>
      <span class="tagline">Cambiador de logos · 6 efectos</span>
      <!-- Botón instalar PWA (aparece solo si el browser lo permite) -->
      <button class="btn-install" id="btnInstall" hidden>
        ⬇ Instalar app
      </button>
    </div>
  </header>

  <!-- Main -->
  <main>

    <!-- PREVIEW CENTRAL -->
    <section class="preview-section">
      <div class="preview-stage" id="previewStage">
        <div class="logo-frame" id="logoFrame"></div>
      </div>
      <div class="preview-info">
        <div class="preview-meta">
          <h2 class="logo-name" id="logoName">YouTube</h2>
          <span class="effect-badge" id="effectBadge">○ Normal</span>
        </div>
        <button class="btn-dl" id="btnDl" title="Guardar PNG">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Guardar PNG
        </button>
      </div>
    </section>

    <!-- PANEL EFECTOS -->
    <section class="panel">
      <p class="panel-label">EFECTO VISUAL</p>
      <div class="effects-row" id="effectsRow"></div>
    </section>

    <!-- PANEL LOGOS -->
    <section class="panel">
      <p class="panel-label">ELIGE UN LOGO</p>
      <div class="logos-grid" id="logosGrid"></div>
    </section>

    <!-- PANEL EXPORTAR COMO ÍCONO DE APP -->
    <section class="panel panel-export">
      <p class="panel-label">EXPORTAR COMO ÍCONO DE APP</p>
      <p class="export-desc">Genera el pack completo de íconos listo para usar en Android APK, PWA o iOS.</p>

      <div class="export-platforms">
        <label class="plat-check">
          <input type="checkbox" id="chkAndroid" checked>
          <span class="plat-badge android">🤖 Android APK</span>
          <span class="plat-sizes">48 · 72 · 96 · 144 · 192 · 512 px</span>
        </label>
        <label class="plat-check">
          <input type="checkbox" id="chkPWA" checked>
          <span class="plat-badge pwa">🌐 PWA</span>
          <span class="plat-sizes">192 · 512 px + manifest.json</span>
        </label>
        <label class="plat-check">
          <input type="checkbox" id="chkIOS">
          <span class="plat-badge ios">🍎 iOS</span>
          <span class="plat-sizes">60 · 76 · 120 · 152 · 180 · 1024 px</span>
        </label>
      </div>

      <button class="btn-pack" id="btnPack">
        <span id="packBtnTxt">📦 Descargar pack de íconos</span>
      </button>

      <div class="export-progress" id="exportProgress" hidden>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <span class="progress-txt" id="progressTxt">Generando…</span>
      </div>
    </section>

  </main>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <!-- JSZip para empaquetar iconos -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
