<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppFX — Cambiador de Logos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- SVG Filters ocultos -->
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Filtro para bordes quemados/rugosos -->
      <filter id="f-burn" x="-30%" y="-30%" width="160%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="4" seed="8" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="28" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <!-- Filtro para efecto hielo -->
      <filter id="f-frost" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="5" result="noise"/>
        <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
        <feBlend in="SourceGraphic" in2="mono" mode="overlay" result="blended"/>
        <feColorMatrix in="blended" type="matrix"
          values="0.65 0.1 0.1 0 0.1
                  0.65 0.1 0.1 0 0.1
                  0.80 0.1 0.2 0 0.2
                  0    0   0   1 0"/>
      </filter>
    </defs>
  </svg>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <span class="brand">App<em>FX</em></span>
      <span class="tagline">Cambiador de logos · 6 efectos</span>
    </div>
  </header>

  <!-- Main -->
  <main>

    <!-- PREVIEW CENTRAL -->
    <section class="preview-section">
      <div class="preview-stage" id="previewStage">
        <!-- El logo-frame es inyectado/actualizado por JS -->
        <div class="logo-frame" id="logoFrame"></div>
      </div>

      <div class="preview-info">
        <div class="preview-meta">
          <h2 class="logo-name" id="logoName">YouTube</h2>
          <span class="effect-badge" id="effectBadge">○ Normal</span>
        </div>
        <button class="btn-dl" id="btnDl" title="Descargar SVG">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Guardar
        </button>
      </div>
    </section>

    <!-- PANEL EFECTOS -->
    <section class="panel">
      <p class="panel-label">EFECTO VISUAL</p>
      <div class="effects-row" id="effectsRow"></div>
    </section>

    <!-- PANEL LOGOS -->
    <section class="panel">
      <p class="panel-label">ELIGE UN LOGO</p>
      <div class="logos-grid" id="logosGrid"></div>
    </section>

  </main>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
<button class="logo-btn" data-logo="image_generator">

</button>
